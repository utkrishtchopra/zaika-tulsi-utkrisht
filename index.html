<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zaika Tulsi – Utkrisht</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fffaf3;
      margin: 0;
      padding: 0;
      text-align: center;
      color: #333;
    }

    header {
      background-color: #c0392b;
      color: white;
      padding: 1rem;
    }

    header img {
      width: 120px;
      display: block;
      margin: 0 auto 10px auto;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin: 2rem auto;
      gap: 1rem;
      max-width: 1000px;
    }

    .gallery img {
      width: 300px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    footer {
      background-color: #c0392b;
      color: white;
      padding: 1rem;
      margin-top: 2rem;
    }

    @media (max-width: 600px) {
      .gallery img {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Zaika Tulsi Logo" />
    <h1>Zaika Tulsi by Utkrisht</h1>
    <p>Food made with love — flavours that feel like home</p>
  </header>

  <main>
    <section class="gallery">
      <img src="flyer-rajma.jpg" alt="Flyer Rajma" />
      <img src="flyer-snacks.jpg" alt="Flyer Snacks" />
      <img src="flyer-contact.jpg" alt="Flyer Contact" />
      <img src="flyer-chinese.jpg" alt="Flyer Chinese" />
      <img src="flyer-highlight-tandoor.jpg" alt="Flyer Highlight Tandoor" />
      <img src="menu-snacks-chinese.jpg" alt="Menu Snacks Chinese" />
      <img src="menu-veg-tandoor.jpg" alt="Menu Veg Tandoor" />
    </section>
  </main>

  <footer>
    <p>© 2025 Zaika Tulsi by Utkrisht — All Rights Reserved.</p>
  </footer>
</body>
</html>
