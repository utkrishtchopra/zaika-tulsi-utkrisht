<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zaika Tulsi</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <img src="./logo.png" alt="Zaika Tulsi Logo" class="logo" />
      <h1>Welcome to Zaika Tulsi</h1>
      <p>Flavours that feel like home</p>
    </header>

    <main>
      <section id="flyers">
        <h2>Our Flyers</h2>
        <div class="flyer-container">
          <img src="./flyer-rajma.jpg" alt="Flyer Rajma" />
          <img src="./flyer-snacks.jpg" alt="Flyer Snacks" />
          <img src="./flyer-chinese.jpg" alt="Flyer Chinese" />
          <img src="./flyer-contact.jpg" alt="Flyer Contact" />
          <img src="./flyer-highlight-tandoor.jpg" alt="Flyer Highlight Tandoor" />
        </div>
      </section>

      <section id="menu">
        <h2>Our Menu</h2>
        <div class="menu-container">
          <img src="./menu-snacks-chinese.jpg" alt="Menu Snacks Chinese" />
          <img src="./menu-veg-tandoor.jpg" alt="Menu Veg Tandoor" />
        </div>
      </section>
    </main>

    <footer>
      <p>© 2025 Zaika Tulsi by Utkrisht. All Rights Reserved.</p>
    </footer>
  </body>
</html>
